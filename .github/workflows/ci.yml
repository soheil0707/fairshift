name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Lint & Test Engine
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Run automated unit tests (SDG 8 Business Logic)
        run: npm test

      - name: Next.js build verification
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: "https://fairshift.vercel.app"
